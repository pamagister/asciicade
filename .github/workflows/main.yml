name: CI

# Linux is the only supported runtime for the terminal application. CI runs the
# full quality gate on every supported Python version and validates that the
# built distributions can be installed and executed.

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'HISTORY.md'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run lint and tests
        run: make test

  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Setup Environment
        uses: ./.github/actions/setup-environment
        with:
          python-version: '3.11'
      - name: Build distributions
        run: make build
      - name: Validate distributions
        run: make validate
      - name: Verify package contents
        run: |
          uv run python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = {
              "asciicade/__init__.py",
              "asciicade/ui/styles/theme.tcss",
          }
          missing = required - names
          assert not missing, f"missing package files: {sorted(missing)}"
          PY
      - name: Install wheel in a clean environment
        run: |
          uv venv /tmp/asciicade-verify
          uv pip install --python /tmp/asciicade-verify/bin/python dist/*.whl
          /tmp/asciicade-verify/bin/asciicade --version