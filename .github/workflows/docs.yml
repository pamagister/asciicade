name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "scripts/update_readme.py"
      - "scripts/render_logo.py"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "scripts/update_readme.py"
      - "scripts/render_logo.py"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  docs:
    name: Build and check documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Sync generated documentation
        run: make syncdocs
      - name: Verify generated files are committed
        run: git diff --exit-code -- README.md docs/_static/img/logo.png docs/_static/img/favicon.png
      - name: Build documentation
        run: make docs
      - name: Check external links
        run: make linkcheck