[project]
name = "asciicade"
version = "0.1.0"
description = "A polished, extensible arcade game collection for Linux terminals."
authors = [
    {name = "pamagister"}
]
readme = "docs/index.md"
license = {text = "Unlicense"}
requires-python = ">=3.11"
keywords = ["terminal", "arcade", "game", "snake", "textual", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Arcade",
]
dependencies = [
    "textual>=0.80.0",
]

[project.urls]
Homepage = "https://github.com/pamagister/asciicade"
Repository = "https://github.com/pamagister/asciicade"
Issues = "https://github.com/pamagister/asciicade/issues"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-mock>=3.14.1",
    "pytest-cov>=6.1.1",
    "coverage>=7.8.2",
    "mypy>=1.16.0",
    "ruff>=0.11.13",
    "build>=1.2.2",
    "twine>=6.0.1",
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-awesome-nav>=2.6.1",
    "pygments>=2.19.1",
]

[project.scripts]
asciicade = "asciicade.cli.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asciicade = ["py.typed", "ui/styles/*.tcss"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/asciicade/_version.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E721", "UP015", "B009", "B905"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["src"]
exclude = ["src/asciicade/_version.py"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
strict_equality = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]